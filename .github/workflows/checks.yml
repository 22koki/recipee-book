name: Cookbook checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cookbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci --prefix recipe-app
      - run: npm --prefix recipe-app test -- --watchAll=false --runInBand
        env:
          CI: 'true'
      - run: npm --prefix recipe-app run build
        env:
          CI: 'true'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Start cookbook
        env:
          RECIPE_DATABASE: /tmp/cookbook-ci.sqlite3
        run: |
          python tests/browser_server.py > /tmp/cookbook-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:5000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cookbook-server.log
          exit 1
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookbook-screenshots
          path: test-results/
